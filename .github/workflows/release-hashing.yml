# Publishes Prdb.Hashing when a hashing version tag is pushed.
#
# The filename is part of the configuration: NuGet pins its trusted publishing
# policy for Prdb.Hashing to "release-hashing.yml". Renaming this file breaks
# publishing until the policy is updated to match.
#
#   git tag hashing/v0.1.0 && git push origin hashing/v0.1.0
#
# Separate from release.yml because this package is versioned independently of
# the four SDKs. It is not generated from the OpenAPI document and does not
# change when the API does, so tying it to their tag would republish it
# unchanged on every API release — and, worse, would force its version forward
# for reasons that have nothing to do with the hashes it computes.
name: Release Prdb.Hashing

on:
  push:
    tags: ['hashing/v*']

permissions: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#hashing/v}" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with the manifest would publish the wrong version
      # under the right name, which NuGet does not let you undo.
      - name: Check the manifest agrees with the tag
        run: |
          manifest="$(sed -n 's|.*<Version>\([^<]*\)</Version>.*|\1|p' \
            csharp/src/Prdb.Hashing/Prdb.Hashing.csproj | head -1)"
          tag='${{ steps.version.outputs.version }}'

          echo "tag      $tag"
          echo "manifest $manifest"

          if [ "$manifest" != "$tag" ]; then
            echo "error: the tag says $tag but the manifest says $manifest" >&2
            echo "  bump Prdb.Hashing.csproj and CHANGELOG.md, then move the tag" >&2
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # ffmpeg is deliberately not installed: the end-to-end tests skip without
      # it, and the reference vectors — the ones that decide whether these
      # hashes still match everyone else's — need no external tool at all.
      - name: Test
        working-directory: csharp
        run: dotnet test tests/Prdb.Hashing.Tests/Prdb.Hashing.Tests.csproj --nologo

  nuget:
    name: Publish to NuGet
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        working-directory: csharp
        run: |
          dotnet build src/Prdb.Hashing/Prdb.Hashing.csproj -c Release --nologo
          dotnet pack src/Prdb.Hashing/Prdb.Hashing.csproj -c Release --no-build --nologo

      # The key this returns is valid for an hour and can be issued only once
      # per token, so it is requested immediately before the push.
      - name: Exchange the OIDC token for a NuGet key
        uses: NuGet/login@v1
        id: login
        with:
          user: prdb

      - name: Push
        working-directory: csharp
        run: |
          dotnet nuget push 'src/Prdb.Hashing/bin/Release/*.nupkg' \
            --api-key '${{ steps.login.outputs.NUGET_API_KEY }}' \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
