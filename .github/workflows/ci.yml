name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  generated-code-is-current:
    name: Generated code matches the spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Regenerate all SDKs
        run: scripts/generate.sh

      # The generated code is committed. If regeneration moves anything, the
      # commit is out of step with spec/openapi.json and must be redone.
      #
      # Checked with `git status --porcelain`, not `git diff`: a new endpoint
      # adds new files, and those stay untracked, which `git diff` does not
      # report. That is the most common kind of change, so `git diff` alone
      # would wave through exactly what this gate exists to catch.
      - name: Check for drift
        run: |
          drift="$(git status --porcelain)"
          if [ -n "$drift" ]; then
            echo "::error::Generated code differs from the committed output."
            echo "Run scripts/generate.sh and commit the result."
            echo "$drift"
            exit 1
          fi

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --upgrade build
      - working-directory: python
        run: |
          pip install -e '.[dev]'
          python -c "import prdb_sdk; print(prdb_sdk.DEFAULT_BASE_URL)"
          python -m pytest
          python -m build

  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 22 is the floor package.json declares, and the floor is the version
      # that actually breaks first. 24 is what most users will be on.
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - working-directory: typescript
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache-dependency-path: go/go.sum
      - working-directory: go
        run: |
          go build ./...
          go vet ./...
          go test ./...

  csharp:
    name: C#
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Both runtimes: the library targets net8.0, and the test project also
      # targets net10.0 so it runs on a machine that has only the current one.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - working-directory: csharp
        run: |
          dotnet build Prdb.Sdk.slnx -c Release --nologo
          dotnet test Prdb.Sdk.slnx -c Release --no-build --nologo
          dotnet pack src/Prdb.Sdk/Prdb.Sdk.csproj -c Release --no-build --nologo
